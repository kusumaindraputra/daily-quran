name: Daily Quran Post

on:
  schedule:
    # 6:42 AM WIB = 23:42 UTC
    - cron: "42 23 * * *"
  workflow_dispatch:  # Allow manual trigger via GitHub UI

permissions:
  contents: write  # Allow git push back to repo

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post daily ayah
        env:
          # OAuth 1.0a — from console.x.com → OAuth 1.0a Keys section
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python3 post_daily.py

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "quran-daily-bot"
          git config user.email "bot@quran-daily.local"
          git add state.json posted_history.json
          git diff --staged --quiet || git commit -m "chore: update post state [skip ci]"
          git push
